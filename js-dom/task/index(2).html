<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Решение алгоритмической задачи</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="number"] {
            padding: 10px;
            width: 100%;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>
<body>
    <h3>Навигация</h3>
    <ul>
        <li><a href="../passport_read/index.html" target="_self">01</a>
        <li><a href="../passport_edit/index(1).html" target="_self">02</a>
        <li><a href="../task/index(2).html" target="_self">Решение задачи</a>
    </ul>
    
    <div class="container">
        <h1>Решение алгоритмической задачи</h1>
        <p>Введите число A для вычисления x по заданной формуле:</p>
        
        <form id="algorithm-form">
            <div class="form-group">
                <label for="a">Введите значение A:</label>
                <input type="number" id="a" name="a" required>
            </div>
            <button type="submit">Вычислить</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById("algorithm-form").addEventListener("submit", function(event) {
            event.preventDefault(); 

            
            var a = parseFloat(document.getElementById("a").value);
            var x;

            
            if (a < 62) {
                // x = a^2 + 4 + 5
                x = a ** 2 + 4 + 5;
            } else {
                // x = 1/(a^2) + 4a + 5
                x = 1 / (a ** 2) + 4 * a + 5;
            }

            
            document.getElementById("result").innerText = "Результат вычисления x: " + x;
        });
    </script>
</body>
</html>
